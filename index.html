<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" href="https://i.imgur.com/3MQaU9U.png">
  <link rel="icon" type="image/png" href="https://i.imgur.com/3MQaU9U.png">
<title>C++ Forge — C++ → Unreal Engine</title>
<style>
:root{--bg:#080b12;--panel:#101522;--panel2:#151c2b;--text:#edf3ff;--muted:#93a1b8;--cyan:#42e8ff;--purple:#9b72ff;--green:#58e58b;--yellow:#ffd166;--red:#ff6b7a;--border:#263149}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#162039 0,#080b12 42%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:280px;border-right:1px solid var(--border);background:#0b101a;position:fixed;inset:0 auto 0 0;overflow:auto;padding:20px 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#07101a;font-weight:1000}
.navbtn{display:block;width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:10px;color:var(--muted);margin:3px 0}.navbtn:hover,.navbtn.active{background:#182238;color:#fff}.progress{margin-top:18px;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}.bar{height:8px;background:#202a3d;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0}
.main{margin-left:280px;width:calc(100% - 280px);padding:28px;max-width:1250px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.eyebrow{color:var(--cyan);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1.5px}.title{font-size:clamp(30px,5vw,52px);line-height:1;margin:8px 0 12px}.sub{color:var(--muted);max-width:760px;line-height:1.65}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid var(--border);background:var(--panel);border-radius:999px;color:var(--muted)}.pill b{color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.card{background:linear-gradient(180deg,var(--panel),#0e1420);border:1px solid var(--border);border-radius:17px;padding:19px;box-shadow:0 12px 30px #0003}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.tag{display:inline-block;border:1px solid #33405a;border-radius:999px;padding:4px 8px;font-size:12px;color:#b9c7dc;margin:3px 4px 3px 0}.btn{padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,#2bdcf4,#8d63f5);color:#07101a;font-weight:900}.btn.secondary{background:#1a2335;color:#fff;border:1px solid var(--border)}.btn.danger{background:#281820;color:#ff9ca7;border:1px solid #5a2934}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.lesson-list{display:grid;gap:8px;margin-top:14px}.lesson-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;background:#0c121e}.lesson-item.done{border-color:#285a43}.lesson-item .num{color:var(--cyan);font-weight:900;min-width:34px}.lesson-item .info{flex:1}.lesson-item button{padding:7px 10px;border-radius:8px;background:#19243a}.lesson-item.done button{background:#163122;color:var(--green)}
.lesson-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.lesson-body{line-height:1.7}.lesson-body pre{background:#070a10;border:1px solid #252e42;padding:15px;border-radius:12px;overflow:auto;color:#d9e7ff}.lesson-body code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.callout{padding:14px;border-left:4px solid var(--cyan);background:#101c2a;border-radius:8px;margin:14px 0}.practice{margin-top:16px;border:1px solid var(--border);border-radius:14px;padding:16px;background:#0c121e}.practice textarea{width:100%;min-height:115px;background:#070a10;border:1px solid #303b53;border-radius:10px;color:#fff;padding:12px;font:14px ui-monospace,monospace;resize:vertical}.feedback{margin-top:10px;padding:10px;border-radius:9px;background:#151d2c;display:none}.feedback.ok{display:block;border:1px solid #286243;color:#9bf0b7}.feedback.no{display:block;border:1px solid #60303a;color:#ffadb6}.choices{display:grid;gap:8px}.choice{padding:10px 12px;text-align:left;border:1px solid var(--border);background:#121a29;border-radius:9px}.choice:hover{border-color:#536789}.choice.correct{border-color:#318056;background:#14281d}.choice.wrong{border-color:#75404a;background:#28161b}.req{display:grid;gap:8px;margin:12px 0}.req label{padding:10px;border:1px solid var(--border);border-radius:9px;background:#0c121e}.req input{accent-color:var(--cyan)}.project{border:1px solid #3b315e;background:linear-gradient(135deg,#111426,#16112a);}.xp{color:var(--yellow);font-weight:900}.badge{font-size:30px}.hidden{display:none!important}.small{font-size:12px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.search{width:100%;padding:10px 12px;background:#0c121e;border:1px solid var(--border);border-radius:10px;color:#fff;margin:8px 0 12px}
@media(max-width:850px){.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border)}.app{display:block}.main{margin:0;width:100%;padding:18px}.grid,.two,.three{grid-template-columns:1fr}.side .lesson-list{max-height:260px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">C++</div>C++ Forge</div>
  <button class="navbtn active" data-page="home">⌂ Course Home</button>
  <button class="navbtn" data-page="lessons">▣ All Lessons</button>
  <button class="navbtn" data-page="projects">⚒ Projects</button>
  <button class="navbtn" data-page="achievements">★ Achievements</button>
  <div class="progress">
    <div class="small muted">COURSE PROGRESS</div>
    <div style="font-size:22px;font-weight:900;margin-top:4px"><span id="doneCount">0</span>/<span id="totalCount">24</span></div>
    <div class="bar"><i id="progressBar"></i></div>
    <div class="small muted"><span id="xp">0</span> XP</div>
  </div>
</aside>
<main class="main" id="app"></main>
</div>
<script>
const lessons=[
{m:"FOUNDATIONS",t:"Program Structure & main()",goal:"Learn the basic shape of a C++ program and how execution starts.",code:`#include <iostream>

int main() {
    std::cout << "Hello, game dev!\\n";
    return 0;
}`,p:["Write a program that prints your game’s title.","Change it so it prints two separate lines."],c:"Which function is the normal entry point of a C++ program?",o:["start()","main()","run()","game()"],a:1,x:40},
{m:"FOUNDATIONS",t:"Variables & Types",goal:"Translate the variables you already know into explicit C++ types.",code:`int health = 100;
float speed = 6.5f;
bool isAlive = true;
char rank = 'A';
std::string name = "Hero";`,p:["Create variables for score, player speed, alive status, and player name.","Change the score during the program and print it."],c:"What type is best for a whole-number health value?",o:["int","bool","char","float"],a:0,x:45},
{m:"FOUNDATIONS",t:"Operators & Input",goal:"Use arithmetic, comparisons, and basic console input.",code:`int hp = 100;
hp -= 25;
bool alive = hp > 0;
std::cout << hp << " " << alive;`,p:["Calculate total damage from two attacks.","Ask for a player name with std::cin and print a greeting."],c:"What does hp -= 10 mean?",o:["hp = 10","hp = hp - 10","hp = hp + 10","hp == 10"],a:1,x:45},
{m:"FOUNDATIONS",t:"Conditions",goal:"Make game decisions with if/else.",code:`if (health <= 0) {
    std::cout << "Defeated";
} else if (health < 30) {
    std::cout << "Critical";
} else {
    std::cout << "Healthy";
}`,p:["Make a shield activate only when mana is at least 20.","Create a damage message for normal, critical, and zero damage."],c:"Which operator means 'equal to' in a condition?",o:["=","==","!=","=>"],a:1,x:45},
{m:"FOUNDATIONS",t:"Loops",goal:"Repeat actions without copying code.",code:`for (int i = 0; i < 5; ++i) {
    std::cout << "Attack " << i + 1 << "\\n";
}`,p:["Print numbers 1 through 10 with a loop.","Simulate five turns and print the turn number each time."],c:"What is a good use for a loop?",o:["Repeating turns","Naming a class","Declaring a type","Including a header"],a:0,x:50},
{m:"FOUNDATIONS",t:"Functions",goal:"Break game logic into reusable pieces.",code:`int calculateDamage(int power, int bonus) {
    return power + bonus;
}

int damage = calculateDamage(20, 5);`,p:["Write a function that returns healing from a base amount plus a bonus.","Write a function that takes health and returns whether the character is alive."],c:"What does a return value let a function do?",o:["Send a result back to its caller","Create a loop","Include a library","Delete an object"],a:0,x:50},

{m:"CORE C++",t:"std::string",goal:"Work with text using the standard library.",code:`#include <string>
std::string weapon = "Crystal Bass";
std::cout << weapon.length();`,p:["Store a character name and print it.","Create a weapon string and combine it with a short message."],c:"Which namespace contains std::string?",o:["game","std","cpp","string"],a:1,x:50},
{m:"CORE C++",t:"std::vector",goal:"Store dynamic lists such as inventory items.",code:`#include <vector>
std::vector<std::string> inventory = {"Potion", "Key", "Sword"};
inventory.push_back("Shield");

for (const auto& item : inventory)
    std::cout << item << "\\n";`,p:["Make a vector containing three items.","Add an item and loop through the inventory."],c:"Which method adds an item to the end of a vector?",o:["add()","push_back()","append_end()","insertLast()"],a:1,x:55},
{m:"CORE C++",t:"References & const",goal:"Understand two C++ features you will constantly see in engine code.",code:`void printName(const std::string& name) {
    std::cout << name;
}`,p:["Write a function taking a const reference to a string.","Explain in your own words why const is useful here."],c:"Why use const std::string& for read-only input?",o:["It prevents copying and prevents modification","It creates a pointer","It makes a global variable","It deletes the string"],a:0,x:55},
{m:"CORE C++",t:"Pointers",goal:"Understand addresses, nullptr, and pointer syntax without panic.",code:`int health = 100;
int* healthPtr = &health;

if (healthPtr != nullptr)
    *healthPtr -= 20;`,p:["Declare a pointer to an int and safely check it before dereferencing.","Trace what value health has after changing it through the pointer."],c:"What does &health produce here?",o:["The value 100","The address of health","A new int","A reference object"],a:1,x:60},
{m:"CORE C++",t:"structs & enums",goal:"Group related data and represent fixed choices clearly.",code:`enum class WeaponType { Sword, Bass, Flute };

struct Stats {
    int health;
    int mana;
};`,p:["Create a Stats struct with health and stamina.","Create an enum class for three character states."],c:"Why is enum class useful?",o:["It represents named choices safely","It replaces all classes","It creates dynamic arrays","It runs a loop"],a:0,x:55},
{m:"CORE C++",t:"Classes & Objects",goal:"Build your first reusable game object type.",code:`class Player {
private:
    int health = 100;

public:
    void TakeDamage(int amount) {
        health -= amount;
    }

    int GetHealth() const {
        return health;
    }
};`,p:["Create a small Enemy class with health and TakeDamage.","Add a getter that returns its health."],c:"What is an object?",o:["A specific instance of a class","A header file","A loop","A compiler"],a:0,x:60},
{m:"CORE C++",t:"Constructors",goal:"Initialize objects cleanly.",code:`class Player {
public:
    Player(std::string newName, int newHealth)
        : name(newName), health(newHealth) {}

private:
    std::string name;
    int health;
};`,p:["Give an Enemy class a constructor that accepts name and health.","Create an Enemy object using that constructor."],c:"When does a constructor run?",o:["When an object is constructed","Every frame","Only after deletion","When a header loads"],a:0,x:60},
{m:"CORE C++",t:"Inheritance & virtual",goal:"Understand the basic idea behind shared gameplay behavior.",code:`class Character {
public:
    virtual void Attack() { std::cout << "Attack"; }
};

class Mage : public Character {
public:
    void Attack() override { std::cout << "Spell"; }
};`,p:["Create a base Character and a derived Warrior with its own Attack.","Identify which behavior should be shared vs specialized."],c:"What does override communicate?",o:["This function replaces a virtual base function","This function is private","This creates a vector","This disables inheritance"],a:0,x:65},

{m:"MODERN C++",t:"Range-based loops & auto",goal:"Read modern C++ game code more comfortably.",code:`std::vector<int> damage = {10, 20, 30};

for (const auto value : damage) {
    std::cout << value << "\\n";
}`,p:["Rewrite an inventory loop using const auto&.","Explain why a reference can be useful when iterating strings."],c:"What does auto do?",o:["Lets the compiler infer the type","Makes a pointer","Runs automatically","Allocates memory"],a:0,x:55},
{m:"MODERN C++",t:"STL algorithms",goal:"Use standard tools instead of reinventing common operations.",code:`#include <algorithm>
std::sort(scores.begin(), scores.end());`,p:["Sort a vector of scores.","Find the maximum score using a standard library tool or a simple loop."],c:"What is the STL?",o:["The C++ standard library collection of containers/algorithms and more","An Unreal editor","A graphics API","A compiler"],a:0,x:60},
{m:"MODERN C++",t:"Smart pointers & ownership",goal:"Understand the ownership ideas behind modern C++.",code:`#include <memory>
auto enemy = std::make_unique<Player>("Enemy", 50);`,p:["Explain what unique ownership means.","Identify where manual new/delete would be unnecessary in modern C++."],c:"What is the main idea of std::unique_ptr?",o:["One owner manages an object’s lifetime","It is always global","It is a vector","It is a reference"],a:0,x:70},
{m:"MODERN C++",t:"Debugging & compiler thinking",goal:"Learn to read errors instead of fearing them.",code:`int health = 100
std::cout << health;`,p:["Spot the syntax error above.","Describe the difference between a compile error and a runtime bug."],c:"What usually happens with a missing semicolon?",o:["Compilation fails","The game gets faster","It becomes a warning only","Nothing"],a:0,x:55},

{m:"UNREAL C++",t:"Unreal Project Anatomy",goal:"Understand where C++ fits inside an Unreal project.",code:`// MyActor.h
UCLASS()
class MYGAME_API AMyActor : public AActor
{
    GENERATED_BODY()
};`,p:["Identify the class name, base class, and Unreal macros.","Find an Actor class in a sample project and describe its role."],c:"What is AActor?",o:["A common base class for world objects","A vector type","A shader","A texture"],a:0,x:65},
{m:"UNREAL C++",t:"Actors & BeginPlay",goal:"Create gameplay behavior that starts when an Actor enters play.",code:`void AMyActor::BeginPlay()
{
    Super::BeginPlay();
    UE_LOG(LogTemp, Display, TEXT("Actor ready!"));
}`,p:["Describe when BeginPlay runs.","Design an Actor that initializes its health when play begins."],c:"Why call Super::BeginPlay()?",o:["To preserve base-class behavior","To create a vector","To compile Blueprint","To delete the Actor"],a:0,x:65},
{m:"UNREAL C++",t:"Components",goal:"Think in reusable pieces instead of giant Actor classes.",code:`UPROPERTY(VisibleAnywhere)
UStaticMeshComponent* Mesh;

UPROPERTY(VisibleAnywhere)
UActorComponent* HealthComponent;`,p:["List two components a simple enemy could use.","Explain why a HealthComponent could be reused on several Actors."],c:"What is a component useful for?",o:["Packaging reusable functionality","Replacing all Actors","Compiling the engine","Only storing textures"],a:0,x:65},
{m:"UNREAL C++",t:"UPROPERTY & UFUNCTION",goal:"Understand the bridge between C++ and the Unreal editor/Blueprints.",code:`UPROPERTY(EditAnywhere, BlueprintReadWrite)
float MaxHealth = 100.f;

UFUNCTION(BlueprintCallable)
void TakeDamage(float Amount);`,p:["Mark a health value so designers can edit it in the editor.","Design a function you would want Blueprint to call."],c:"What can UPROPERTY help Unreal do?",o:["Reflect/expose/manage a property for engine systems","Replace C++ types","Compile shaders only","Create a new IDE"],a:0,x:70},
{m:"UNREAL C++",t:"Gameplay Architecture",goal:"Combine Actors, Components, data, and functions into maintainable systems.",code:`class UHealthComponent : public UActorComponent
{
    GENERATED_BODY()
public:
    void ApplyDamage(float Amount);
    float GetHealth() const { return Health; }
private:
    float Health = 100.f;
};`,p:["Sketch a reusable health component.","Decide what belongs in the component vs the Character."],c:"Which design is usually easier to reuse?",o:["A focused component with one responsibility","One enormous Player class","Duplicated logic everywhere","Only Blueprint graphs"],a:0,x:80}
];

const projects=[
{name:"Text Combat",module:"Foundations",xp:250,desc:"Build a console battle loop using the C++ fundamentals you just learned.",req:["Player and enemy health","At least two attacks","if/else combat decisions","A loop for turns","At least two functions","Win/lose result"],stretch:"Add critical hits, healing, or a simple enemy AI."},
{name:"Inventory System",module:"Core C++",xp:300,desc:"Build a small inventory using strings, vectors, loops, structs, and functions.",req:["Vector inventory","Add/remove item behavior","Item display loop","At least one struct","Search for an item","Clean functions"],stretch:"Add item quantities and a maximum capacity."},
{name:"RPG Character System",module:"Classes",xp:350,desc:"Create Character, Player, and Enemy classes with constructors and useful methods.",req:["Character class","Constructor initialization","Private stats","Getters/setters where appropriate","Damage/healing methods","At least one derived class"],stretch:"Add virtual Attack behavior and multiple enemy types."},
{name:"Ability System",module:"Modern C++",xp:400,desc:"Design a reusable ability system using STL containers and modern C++ ideas.",req:["Ability data","Vector of abilities","Cooldown concept","Functions for activation","Const/reference usage","Clear ownership decisions"],stretch:"Use smart pointers or lambdas where they genuinely improve the design."},
{name:"Unreal Health Component",module:"Unreal C++",xp:500,desc:"Build a reusable Unreal ActorComponent that owns health logic.",req:["UActorComponent subclass","Health and MaxHealth","UPROPERTY values","Damage function","Healing function","Blueprint-callable interface","On-death behavior"],stretch:"Add an event/delegate and UI hookup."},
{name:"Final Project — Gameplay Prototype",module:"Everything",xp:1000,desc:"Build a small Unreal gameplay prototype that proves you can combine C++ systems with Blueprint.",req:["A playable Character or Actor","Reusable health component","Damage source","At least one ability","C++ ↔ Blueprint workflow","Debug logging","Clean class responsibilities","A short playable loop"],stretch:"Add an enemy, UI, saveable progression, or a music/rhythm mechanic."}
];

let state=JSON.parse(localStorage.getItem("cppForgeState")||'{"done":[],"projects":[],"xp":0,"badges":[]}');
function save(){localStorage.setItem("cppForgeState",JSON.stringify(state));renderStats()}
function renderStats(){
 document.getElementById("doneCount").textContent=state.done.length;
 document.getElementById("totalCount").textContent=lessons.length;
 document.getElementById("xp").textContent=state.xp;
 document.getElementById("progressBar").style.width=(state.done.length/lessons.length*100)+"%";
}
function addXP(n){state.xp+=n;save()}
function page(name){
 document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===name));
 if(name==="home") home(); if(name==="lessons") lessonsPage(); if(name==="projects") projectsPage(); if(name==="achievements") achievementsPage();
}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>page(b.dataset.page));

function home(){
 const completed=state.done.length;
 document.getElementById("app").innerHTML=`
 <div class="top"><div><div class="eyebrow">Learn C++ for game development</div><div class="title">C++ Forge</div><div class="sub">A practical path from Standard C++ to Unreal Engine C++. You already know programming concepts — this course focuses on translating those skills into C++ and then into Unreal.</div></div><div class="stats"><div class="pill">XP <b>${state.xp}</b></div><div class="pill">Lessons <b>${completed}/${lessons.length}</b></div></div></div>
 <div class="grid">
  <div class="card"><h2>How each lesson works</h2><div class="muted">Short explanations, then you actually use the idea.</div><div class="lesson-list">
   <div class="lesson-item"><span class="num">01</span><div class="info"><b>Concept</b><br><span class="small muted">What the feature means and why it exists.</span></div></div>
   <div class="lesson-item"><span class="num">02</span><div class="info"><b>Syntax</b><br><span class="small muted">A compact game-dev example.</span></div></div>
   <div class="lesson-item"><span class="num">03</span><div class="info"><b>Practice ×2</b><br><span class="small muted">Two exercises that force you to write it.</span></div></div>
   <div class="lesson-item"><span class="num">04</span><div class="info"><b>Challenge + checkpoint</b><br><span class="small muted">Use the idea without being spoon-fed.</span></div></div>
  </div></div>
  <div class="card project"><h2>🏆 Big projects</h2><div class="muted">Every major section ends with a project. The final one combines the whole course.</div><div class="actions"><button class="btn" onclick="page('projects')">View projects</button></div></div>
 </div>
 <div class="card" style="margin-top:16px"><h2>Course roadmap</h2><div class="grid two">${["FOUNDATIONS","CORE C++","MODERN C++","UNREAL C++"].map((m,i)=>`<div class="card"><span class="eyebrow">0${i+1}</span><h3>${m}</h3><p class="muted">${i===0?"Translate familiar programming concepts into C++ syntax.":i===1?"Learn the C++ features that make game systems possible.":i===2?"Read and write cleaner modern C++ with the standard library.":"Move from language knowledge into real Unreal gameplay architecture."}</p><button class="btn secondary" onclick="page('lessons');setTimeout(()=>openLesson(${lessons.findIndex(x=>x.m===m)}),30)">Start section</button></div>`).join("")}</div></div>`;
 renderStats();
}
function lessonsPage(){
 document.getElementById("app").innerHTML=`<div class="top"><div><div class="eyebrow">Course</div><h1>All lessons</h1><p class="sub">Do them in order. If something feels familiar, skim the explanation and spend your time on the practice.</p></div></div><input class="search" id="search" placeholder="Search lessons..." oninput="filterLessons(this.value)"><div class="lesson-list" id="lessonList"></div>`;
 filterLessons("");renderStats();
}
function filterLessons(q){
 const list=document.getElementById("lessonList"); if(!list)return;
 list.innerHTML=lessons.map((l,i)=>({l,i})).filter(z=>(z.l.t+" "+z.l.m).toLowerCase().includes(q.toLowerCase())).map(({l,i})=>`
 <div class="lesson-item ${state.done.includes(i)?"done":""}"><span class="num">${String(i+1).padStart(2,"0")}</span><div class="info"><b>${l.t}</b><br><span class="small muted">${l.m} · ${l.goal}</span></div><button onclick="openLesson(${i})">${state.done.includes(i)?"Review":"Start"} ${state.done.includes(i)?"✓":""}</button></div>`).join("");
}
function openLesson(i){
 const l=lessons[i], next=i+1<lessons.length?i+1:null;
 document.getElementById("app").innerHTML=`
 <div class="lesson-head"><div><div class="eyebrow">${l.m} · LESSON ${i+1}</div><h1>${l.t}</h1><p class="sub">${l.goal}</p></div><div class="xp">+${l.xp||l.x} XP</div></div>
 <div class="card lesson-body">
 <h2>1. Concept</h2><p>${concept(l,i)}</p>
 <div class="callout"><b>🎮 Why this matters for games:</b> ${gameWhy(l,i)}</div>
 <h2>2. Syntax</h2><pre><code>${esc(l.code)}</code></pre>
 <div class="practice"><h3>3. Practice #1</h3><p>${l.p[0]}</p><textarea id="p1" placeholder="Write your solution here..."></textarea><div class="actions"><button class="btn secondary" onclick="hint(${i},1)">I'm stuck</button><button class="btn" onclick="checkPractice(1)">Check practice</button></div><div id="fb1" class="feedback"></div></div>
 <div class="practice"><h3>4. Practice #2</h3><p>${l.p[1]}</p><textarea id="p2" placeholder="Write your solution here..."></textarea><div class="actions"><button class="btn secondary" onclick="hint(${i},2)">Give me a hint</button><button class="btn" onclick="checkPractice(2)">Check practice</button></div><div id="fb2" class="feedback"></div></div>
 <div class="practice"><h3>5. Challenge</h3><p>${challenge(l,i)}</p><button class="btn secondary" onclick="showChallenge(${i})">Show challenge hint</button><div id="challengeHint" class="feedback"></div></div>

function concept(l,i){
 const map={0:"C++ programs are compiled, and main() is where normal execution begins. Include only what you need, then keep the program flow readable.",1:"Unlike many beginner-friendly languages, C++ normally makes the type explicit. That extra information gives the compiler more opportunities to catch mistakes.",2:"Operators work much like other languages, but C++ gives you precise control over integer, floating-point, comparison, and boolean operations.",3:"Conditions are the decision points of gameplay: alive or defeated, enough mana or not, hit or miss, quest complete or not.",4:"Loops are ideal for turns, inventory traversal, spawning repeated data, and processing collections.",5:"Functions let you name a piece of behavior. Good functions make game code easier to test, reuse, and reason about.",6:"std::string is the standard C++ text type you will see constantly in gameplay, UI, save data, and tools.",7:"std::vector is the go-to dynamic array in everyday C++. It grows as you add items and works naturally with loops and algorithms.",8:"References let you work with an existing object without copying it. const communicates that a function promises not to modify the referenced value.",9:"A pointer stores an address. Pointers matter in C++ because engines often work with objects whose existence and ownership are managed elsewhere.",10:"structs package related data. enum class gives a variable a small, explicit set of named states.",11:"A class combines data and behavior. An object is a concrete instance of that class — perfect for modeling players, enemies, weapons, and systems.",12:"Constructors establish an object’s initial valid state. Initializer lists are a common, efficient C++ pattern.",13:"Inheritance lets a derived class specialize a common base interface. virtual and override are important concepts for polymorphic gameplay behavior.",14:"Modern C++ often favors range-based loops and auto when they make code clearer. You still need to understand the actual types underneath.",15:"The standard library already solves many common problems. Learning its containers and algorithms prevents unnecessary custom code.",16:"Ownership is one of the big differences between C++ and garbage-collected languages. Smart pointers encode ownership and make lifetime management safer.",17:"Compilation errors are information. Read the first useful error, find the line it points to, and fix one problem at a time.",18:"Unreal builds its gameplay architecture on C++ classes, reflection macros, Actors, Components, and engine-managed lifecycles.",19:"BeginPlay is an Unreal lifecycle hook. Calling the base implementation with Super::BeginPlay() preserves behavior from the parent class.",20:"Components let you compose Actors from focused pieces. Health, inventory, interaction, and audio can often be reusable components.",21:"UPROPERTY and UFUNCTION are part of Unreal’s reflection/editor/Blueprint ecosystem. They make C++ data and behavior visible to engine systems.",22:"The best gameplay code is usually organized around responsibilities. A reusable component can own health while an Actor decides what that health means in its context.",23:"A real prototype forces you to integrate everything: language fundamentals, classes, data structures, debugging, Unreal lifecycle, and Blueprint collaboration."};return map[i]||"Learn the idea, read the example, then immediately write your own version.";
}
function gameWhy(l,i){return i<6?"This is the raw material behind every gameplay rule.":i<14?"These features are the foundation of player, enemy, item, and combat systems.":i<18?"Unreal codebases use these patterns heavily, so fluency here makes engine code much easier to read.":"You are now learning the exact bridge between normal C++ and Unreal’s gameplay framework."}
function challenge(l,i){return ["Combine a variable, condition, loop, and function into a tiny turn simulation.","Create a mini score tracker with at least three variables and a meaningful calculation.","Make a tiny damage calculator that handles armor and minimum damage.","Create a three-state gameplay decision such as Explore/Fight/Escape.","Simulate three enemies taking turns and print each turn.","Build a function that calculates final damage and another that applies it.","Build a small dialogue/name system using strings.","Make a five-item inventory and print only items matching a condition.","Write a read-only function that inspects a character without modifying it.","Explain on paper what happens when a pointer is nullptr vs valid.","Combine a Stats struct with an enum class state.","Make a Character object and use methods to change its state.","Construct two enemies with different starting stats.","Use a base class and two derived classes with different attack behavior.","Rewrite a collection loop using modern syntax.","Choose one standard algorithm that could simplify a system you have written.","Draw an ownership diagram for a Player and its owned data.","Take a deliberately broken snippet and list the compiler errors you expect.","Sketch the C++ files you would create for a simple Unreal Actor.","Describe the lifecycle of an Actor from creation into play.","Design an Actor from three reusable components.","Design one C++ property and one function that a Blueprint designer should access.","Separate health logic from character movement in your design.","Combine these ideas into a tiny gameplay architecture on paper."][i]||"Extend the example into a small game system of your own."}
function hint(i,n){const hints=["Try #include <iostream>, then int main(), then std::cout.","Start with the simplest version first; add the second requirement after it works.","Use a variable for each piece of information, then calculate the result.","Think of the condition as a yes/no question.","Pick a starting value, a condition, and a change each iteration.","Decide what inputs the function needs and what result it should return.","Include <string> and use std::string.","Include <vector>, initialize it, then push_back an item.","Use const before the type and & after it for the parameter.","Ask yourself: 'What is the address of this variable?'","Keep data together in the struct; keep the fixed choices in the enum.","Put data and methods inside class; create an object afterward.","The constructor name matches the class name.","Use : public BaseClass and override a virtual function.","const auto& is a useful default when you only need to read elements.","Look at <algorithm> before writing your own sorting code.","unique_ptr is about one clear owner and automatic cleanup.","Fix the first compiler error before worrying about later errors.","Look for AActor and Unreal macros.","BeginPlay is a lifecycle function called when play starts.","A component should do one focused job.","Think about what a designer should edit or what Blueprint should call.","Give each system one responsibility.","Start small: Character + HealthComponent + one damage source."][i];const el=document.getElementById(n===1?"fb1":"fb2");el.className="feedback ok";el.style.display="block";el.textContent="💡 Hint: "+hints}
function checkPractice(n){const el=document.getElementById("p"+n),fb=document.getElementById("fb"+n);if(el.value.trim().length<20){fb.className="feedback no";fb.style.display="block";fb.textContent="Keep going — write a little more of your solution before checking it.";return}fb.className="feedback ok";fb.style.display="block";fb.textContent="Looks like you made a real attempt. Compare it against the syntax example and make sure every requirement is covered. No automatic compiler is required here — understanding your code matters."}
function showChallenge(i){const el=document.getElementById("challengeHint");el.className="feedback ok";el.style.display="block";el.textContent="Break it into the smallest pieces you already know. Get the simplest version working first, then add one feature at a time."}
function answer(i,j,btn){const l=lessons[i];document.querySelectorAll(".choice").forEach((b,k)=>{b.disabled=true;if(k===l.a)b.classList.add("correct")});const fb=document.getElementById("quizFb");if(j===l.a){btn.classList.add("correct");fb.className="feedback ok";fb.style.display="block";fb.textContent="Correct! You understand the checkpoint."}else{btn.classList.add("wrong");fb.className="feedback no";fb.style.display="block";fb.textContent="Not quite. The correct answer is highlighted — reread the concept and try explaining why."}}
